<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>날씨 데이터 대시보드</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="theme-color" content="#2563eb">
</head>
<body>

<div class="app">
  <h1>날씨 데이터 대시보드</h1>
  <p class="sub">도시 이름을 쉼표로 구분해서 입력하면 각각의 날씨를 한번에 보여줍니다.</p>

  <form id="searchForm" class="search-form">
    <input type="text" id="cityInput" placeholder="예: Seoul, Busan, Tokyo" value="Seoul, Busan, Tokyo">
    <button type="submit">조회</button>
  </form>

  <button type="button" id="windMapBtn" class="wind-map-btn">🌬️ 바람 지도 보기</button>

  <div id="chipArea">
    <div id="favoriteChips" class="chip-row"></div>
    <div id="recentChips" class="chip-row"></div>
  </div>

  <p id="statusMsg" class="status"></p>

  <div id="resultsContainer" class="results-container"></div>
</div>

<div id="windMapModal" class="wind-map-modal hidden">
  <div class="wind-map-panel">
    <button type="button" id="windMapCloseBtn" class="wind-map-close">✕</button>
    <iframe id="windMapFrame" class="wind-map-iframe" title="Windy 바람 지도" loading="lazy"></iframe>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
